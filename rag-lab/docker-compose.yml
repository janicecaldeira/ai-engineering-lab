services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: raglab
      POSTGRES_DB: raglab
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rag-lab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raglab -d raglab"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  rag-lab-postgres-data:
